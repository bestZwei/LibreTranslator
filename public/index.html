<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="LibreTranslator - 免费开源的在线翻译工具，支持多种语言翻译">
    <meta name="keywords" content="翻译,translator,libre translator,开源翻译,在线翻译">
    <meta name="author" content="LibreTranslator">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="LibreTranslator - 免费开源翻译工具">
    <meta property="og:description" content="使用LibreTranslator进行快速准确的在线翻译">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://libretranslator.is-an.org">

    <title>LibreTranslator - 免费开源在线翻译网站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
